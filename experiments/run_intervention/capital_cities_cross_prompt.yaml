  vancouver_victoria: "https://www.neuronpedia.org/gemma-2-2b/graph?slug=gemma-fact-vancouver-victoria&clerps=%5B%5D&clickedId=4_11742_9&pruningThreshold=0.45&pinnedIds=27_18221_10%2CE_32936_9%2C21_2236_10%2C19_15123_10%2C18_1025_10%2C14_12562_9%2C14_5600_9%2C6_11873_9%2C4_8439_9%2CE_6037_4%2CE_19412_7%2C4_11742_9%2C0_16137_7&supernodes=%5B%5B%22Canada%22%2C%2214_5600_9%22%2C%226_11873_9%22%2C%224_8439_9%22%5D%5D"

prompts:
  dallas: "Fact: the capital of the state containing Dallas is"
  oakland: "Fact: the capital of the state containing Oakland is"
  shanghai: "Fact: the capital of the country containing Shanghai is"
  vancouver: "Fact: the capital of the territory containing Vancouver is"

supernodes:
  # --- Base Dallas/Austin nodes ---
  say_austin:
    features:
      - {layer: 23, pos: 10, feature_idx: 12237}

  say_capital:
    features_from:
      graph: dallas_austin
      groups: ["capital cities / say a capital city"]
    children: [say_austin]

  texas:
    features_from:
      graph: dallas_austin
      groups: ["Texas"]
    children: [say_austin]

  state:
    features_from:
      graph: dallas_austin
      groups: ["state"]
    children: [say_capital, texas]

  capital:
    features_from:
      graph: dallas_austin
      groups: ["capital"]
    children: [say_capital]

  emb_dallas:
    features: null
    children: [texas]

  emb_state:
    features: null
    children: [state]

  emb_capital:
    features: null
    children: [capital]

  # --- Oakland/Sacramento cross-prompt nodes ---
  say_sacramento:
    features:
      - {layer: 19, pos: 10, feature_idx: 9209}

  california:
    features_from:
      graph: oakland_sacramento
      groups: ["California", "California (2)"]
    children: [say_sacramento]

  # --- Shanghai/Beijing cross-prompt nodes ---
  china:
    features_from:
      graph: shanghai_beijing
      groups: ["China", "China (2)"]

  # --- Vancouver/Victoria cross-prompt nodes ---
  say_victoria:
    features:
      - {layer: 21, pos: 10, feature_idx: 2236}

  british_columbia:
    features:
      - {layer: 18, pos: 10, feature_idx: 1025}
    children: [say_victoria]

graph_layout:
  - [emb_capital, emb_state]
  - [capital, state, emb_dallas]
  - [say_capital, texas]
  - [say_austin]

experiments:
  swap_texas_california:
    description: "Say Austin shuts off, Say Sacramento activates, top output becomes Sacramento"
    prompt: dallas
    initialize:
      dallas: [capital, state, emb_dallas, say_capital, texas, say_austin]
      oakland: [say_sacramento, california]
    interventions:
      - actions:
          - {node: texas, scale: -2}
          - {node: california, scale: 2}
        replacements:
          texas: california
          say_austin: say_sacramento

  swap_texas_china:
    description: "Beijing becomes the model's most likely output"
    prompt: dallas
    initialize:
      dallas: [capital, state, emb_dallas, say_capital, texas, say_austin]
      shanghai: [china]
    interventions:
      - actions:
          - {node: texas, scale: -2}
          - {node: china, scale: 2}
        replacements:
          texas: china

  swap_texas_bc:
    description: "Not very effective - BC addition does little beyond Texas ablation"
    prompt: dallas
    initialize:
      dallas: [capital, state, emb_dallas, say_capital, texas, say_austin]
      vancouver: [say_victoria, british_columbia]
    interventions:
      - actions:
          - {node: texas, scale: -2}
          - {node: british_columbia, scale: 2}
        replacements:
          texas: british_columbia
          say_austin: say_victoria