prompts:
  small_big_fr: 'Le contraire de "petit" est "'
  small_big_zh: '"小"的反义词是"'

supernodes:
  french:
    features_from:
      graph: small_big_fr
      groups: ["French"]

  say_big:
    features_from:
      graph: small_big_fr
      groups: ["say big / large"]

  small:
    features_from:
      graph: small_big_fr
      groups: ["small"]
    children: [say_big]

  opposite:
    features_from:
      graph: small_big_fr
      groups: ["opposite"]
    children: [say_big]

  chinese:
    features_from:
      graph: small_big_zh
      groups: ["Chinese", "Chinese-related English text"]

graph_layout:
  - [french, opposite, small]
  - [say_big]

experiments:
  turn_off_french:
    description: "Turning off French produces English output; Say big barely affected"
    prompt: small_big_fr
    initialize:
      small_big_fr: [say_big, small, french, opposite]
      small_big_zh: [chinese]
    interventions:
      - actions:
          - {node: french, scale: -2}

  french_to_chinese:
    description: "Output matches original Chinese prompt output"
    prompt: small_big_fr
    initialize:
      small_big_fr: [say_big, small, french, opposite]
      small_big_zh: [chinese]
    interventions:
      - actions:
          - {node: french, scale: -2}
          - {node: chinese, scale: 2}
        replacements:
          french: chinese